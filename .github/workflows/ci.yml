name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: make check
      # Retrieval quality gate: builds the example index and fails below the pack's bar.
      - run: make ingest
      - run: make eval-retrieval
