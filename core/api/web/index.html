<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brain demo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%227%22 fill=%22%233056d3%22/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #667085; --line: #e4e7ec;
    --accent: #3056d3; --accent-soft: #e8edfc; --ok: #1f8f55; --warn: #b54708; --bad: #c4320a;
    --user: #eef2ff; --code: #f2f4f7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1218; --panel: #171b23; --text: #e6e8ec; --muted: #98a2b3; --line: #2a303b;
      --accent: #7c9cff; --accent-soft: #1d2640; --ok: #47c389; --warn: #f0a050; --bad: #ff7a59;
      --user: #1c2336; --code: #1f2430;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 2; background: var(--panel);
           border-bottom: 1px solid var(--line); padding: 10px 16px;
           display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
  header h1 { font-size: 16px; margin: 0; }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--accent-soft);
           color: var(--accent); white-space: nowrap; }
  .badge.warn { background: transparent; border: 1px solid var(--warn); color: var(--warn); }
  .token { margin-left: auto; display: flex; gap: 6px; flex: 1 1 280px; max-width: 520px; }
  input, textarea, button { font: inherit; color: inherit; }
  input, textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
                    padding: 7px 10px; width: 100%; }
  button { border: 1px solid var(--line); background: var(--panel); border-radius: 8px;
           padding: 7px 12px; cursor: pointer; white-space: nowrap; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  main { max-width: 820px; margin: 0 auto; padding: 16px 16px 140px; }
  .hint { color: var(--muted); font-size: 13px; }
  .msg { margin: 14px 0; padding: 12px 14px; border-radius: 12px; background: var(--panel);
         border: 1px solid var(--line); overflow-wrap: anywhere; }
  .msg.user { background: var(--user); margin-left: 15%; }
  .msg .text p { margin: 0 0 8px; }
  .msg .text ul { margin: 0 0 8px; padding-left: 20px; }
  .msg .text code { background: var(--code); padding: 1px 4px; border-radius: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .chip { font-size: 12px; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--line);
          color: var(--muted); }
  .chip.ok::before { content: "✓ "; color: var(--ok); }
  .chip.fail::before { content: "✗ "; color: var(--bad); }
  .approval { border: 1px solid var(--warn); border-radius: 10px; padding: 10px 12px;
              margin: 8px 0; }
  .approval h3 { margin: 0 0 6px; font-size: 14px; color: var(--warn); }
  .action { border-top: 1px solid var(--line); padding: 8px 0; }
  .action pre { background: var(--code); border-radius: 6px; padding: 6px 8px; margin: 6px 0;
                font-size: 12px; overflow-x: auto; }
  .action .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .meta { margin-top: 10px; font-size: 12px; color: var(--muted); display: flex;
          flex-wrap: wrap; gap: 4px 12px; }
  .sources { margin-top: 8px; font-size: 13px; }
  .sources li.cited { font-weight: 600; }
  .flag { color: var(--warn); }
  .blocked { color: var(--bad); }
  .feedback button { padding: 2px 8px; font-size: 13px; }
  .composer { position: fixed; bottom: 0; left: 0; right: 0; background: var(--panel);
              border-top: 1px solid var(--line); padding: 10px 16px; }
  .composer form { max-width: 820px; margin: 0 auto; display: flex; gap: 8px; }
  .composer textarea { resize: none; height: 46px; }
  .error { color: var(--bad); font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1 id="brain">Brain</h1>
  <span class="badge" id="access">…</span>
  <span class="badge" id="tools">…</span>
  <div class="token">
    <input id="token" type="password" placeholder="Bearer token (make -s token as=USER)"
           aria-label="Bearer token" autocomplete="off">
    <button id="save-token" type="button">Use</button>
  </div>
</header>

<main id="log">
  <p class="hint">A demo client for the brain's API. Answers stream with their sources and the
  tools they used; actions that change data wait here for your approval. Everything shown is
  what <code>/v1/chat</code> returns.</p>
</main>

<div class="composer">
  <form id="ask">
    <textarea id="question" placeholder="Ask something…" aria-label="Question" required></textarea>
    <button class="primary" id="send" type="submit">Send</button>
  </form>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const conversation = [];  // sent with every request
let token = "";
try { token = localStorage.getItem("brain-token") || ""; } catch { /* storage blocked */ }
$("token").value = token;

$("save-token").onclick = () => {
  token = $("token").value.trim();
  try { localStorage.setItem("brain-token", token); } catch { /* fine */ }
  loadHealth();
};

function headers() {
  const h = { "content-type": "application/json" };
  if (token) h.authorization = `Bearer ${token}`;
  return h;
}

async function loadHealth() {
  try {
    const health = await (await fetch("/healthz")).json();
    $("brain").textContent = `${health.brain} brain`;
    document.title = `${health.brain} brain demo`;
    const open = health.access === "open";
    $("access").textContent = open ? "open access" : "token required";
    $("access").className = open ? "badge warn" : "badge";
    $("tools").textContent = `${health.tools.length} tools` +
      (health.tool_servers_down.length ? ` (${health.tool_servers_down.length} servers down)` : "");
  } catch { $("access").textContent = "brain unreachable"; }
}

// Minimal, safe Markdown: escape everything, then bold, inline code, bullet lists, paragraphs.
function render(text) {
  const esc = text.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;",
    '"': "&quot;", "'": "&#39;" })[c]);
  const inline = (s) => s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
                         .replace(/`([^`]+)`/g, "<code>$1</code>");
  return esc.split(/\n{2,}/).map((block) => {
    const lines = block.split("\n");
    if (lines.every((l) => /^\s*[-*] /.test(l))) {
      return "<ul>" + lines.map((l) => `<li>${inline(l.replace(/^\s*[-*] /, ""))}</li>`).join("") + "</ul>";
    }
    return `<p>${inline(lines.join("<br>"))}</p>`;
  }).join("");
}

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}

// A bubble holds one or more sections: the answer up to an approval, then what follows it.
function section(box) {
  const parts = { box, chips: el("div", "chips"), text: el("div", "text"), extra: el("div") };
  box.append(parts.chips, parts.text, parts.extra);
  box.scrollIntoView({ block: "end", behavior: "smooth" });
  return parts;
}

function bubble(role) {
  const box = el("div", `msg ${role}`);
  $("log").append(box);
  return section(box);
}

// Read a Server-Sent Events response and call onEvent(name, data) for each event.
async function readEvents(response, onEvent) {
  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "";
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    let cut;
    while ((cut = buffer.indexOf("\n\n")) >= 0) {
      const raw = buffer.slice(0, cut);
      buffer = buffer.slice(cut + 2);
      const name = (raw.match(/^event: (.*)$/m) || [])[1];
      const data = (raw.match(/^data: (.*)$/m) || [])[1];
      if (name && data) onEvent(name, JSON.parse(data));
    }
  }
}

async function post(url, body, view) {
  const response = await fetch(url, { method: "POST", headers: headers(), body: JSON.stringify(body) });
  if (!response.ok) {
    const detail = (await response.json().catch(() => ({}))).detail || response.statusText;
    const message = response.status === 401 ? "A valid token is needed: paste one above." : detail;
    view.extra.append(el("p", "error", `${response.status}: ${typeof message === "string" ? message : JSON.stringify(message)}`));
    return null;
  }
  return response;
}

// One streamed answer into one bubble. Decisions on paused actions continue in the same bubble.
async function stream(response, view, state) {
  await readEvents(response, (name, data) => {
    if (name === "delta") {
      state.text += data.text;
      view.text.innerHTML = render(state.text);
    } else if (name === "tool") {
      const chip = el("span", `chip ${data.ok ? "ok" : "fail"}`, `${data.name} · step ${data.step}`);
      chip.title = `${data.latency_ms} ms`;
      view.chips.append(chip);
    } else if (name === "replace") {
      state.text = data.text;  // a guardrail replaced what streamed
      view.text.innerHTML = render(state.text);
    } else if (name === "approval") {
      showApproval(data, view, state);
    } else if (name === "done") {
      showMeta(data, view);
      if (data.status !== "awaiting_approval") {
        const full = [state.prefix, state.text].filter(Boolean).join("\n\n");
        conversation.push({ role: "assistant", content: full || "(no answer)" });
      }
    } else if (name === "error") {
      view.extra.append(el("p", "error", data.message));
    }
  });
}

function showApproval(data, view, state) {
  const card = el("div", "approval");
  card.append(el("h3", null, "Waiting for your approval"));
  const choices = {};
  for (const action of data.pending) {
    const row = el("div", "action");
    row.append(el("strong", null, action.tool));
    row.append(el("pre", null, JSON.stringify(action.arguments, null, 2)));
    const buttons = el("div", "row");
    const yes = el("button", "primary", "Approve");
    const no = el("button", null, "Decline");
    const pick = (approve) => {
      choices[action.call_id] = approve;
      yes.disabled = no.disabled = true;
      (approve ? yes : no).textContent = approve ? "Approved" : "Declined";
      if (Object.keys(choices).length === data.pending.length) decide(data.run_id, choices, view, state, card);
    };
    yes.onclick = () => pick(true);
    no.onclick = () => pick(false);
    buttons.append(yes, no);
    row.append(buttons);
    card.append(row);
  }
  view.extra.append(card);
}

async function decide(runId, choices, view, state, card) {
  const decisions = Object.entries(choices).map(([call_id, approve]) => ({ call_id, approve }));
  const response = await post(`/v1/runs/${runId}/decisions`, { decisions }, view);
  if (!response) return;
  card.querySelector("h3").textContent = "Decided";
  const next = section(view.box);  // the rest of the answer goes below the decision
  await stream(response, next, { text: "", prefix: [state.prefix, state.text].filter(Boolean).join("\n\n") });
}

function showMeta(data, view) {
  if (data.sources.length) {
    const list = el("ol", "sources");
    for (const s of data.sources) {
      const item = el("li", s.cited ? "cited" : "", `${s.title}: ${s.section || "intro"}`);
      item.value = s.index;
      item.title = s.source;
      list.append(item);
    }
    const details = el("details");
    details.append(el("summary", "hint", `Sources (${data.sources.filter((s) => s.cited).length} cited)`), list);
    view.extra.append(details);
  }
  const meta = el("div", "meta");
  const u = data.usage;
  const cachedShare = u.input_tokens ? Math.round(100 * u.cache_read_tokens / u.input_tokens) : 0;
  meta.append(
    el("span", data.status === "blocked" ? "blocked" : "", data.status),
    el("span", null, data.cached ? `answer cache (${data.cached})` : `${data.model}${data.tier ? ` · ${data.tier} tier` : ""}`),
    el("span", null, `${u.input_tokens} in (${cachedShare}% cached) / ${u.output_tokens} out`),
    el("span", null, `${(data.latency_ms / 1000).toFixed(1)} s`),
  );
  for (const flag of data.guard_flags) {
    meta.append(el("span", flag.blocked ? "blocked" : "flag", `${flag.guard}${flag.blocked ? " (blocked)" : ""}`));
  }
  if (data.status !== "awaiting_approval") {
    const feedback = el("span", "feedback");
    for (const [rating, label] of [["up", "👍"], ["down", "👎"]]) {
      const b = el("button", null, label);
      b.setAttribute("aria-label", `Rate ${rating}`);
      b.onclick = async () => {
        const r = await fetch("/v1/feedback", { method: "POST", headers: headers(),
          body: JSON.stringify({ trace_id: data.trace_id, rating }) });
        feedback.textContent = r.ok ? "thanks" : "feedback failed";
      };
      feedback.append(b);
    }
    meta.append(feedback);
  }
  const trace = el("span", null, `trace ${data.trace_id.slice(0, 12)}`);
  trace.title = `uv run python -m core.cli traces --id ${data.trace_id}`;
  meta.append(trace);
  view.extra.append(meta);
}

$("ask").onsubmit = async (event) => {
  event.preventDefault();
  const question = $("question").value.trim();
  if (!question) return;
  $("question").value = "";
  $("send").disabled = true;
  bubble("user").text.textContent = question;
  conversation.push({ role: "user", content: question });
  const view = bubble("assistant");
  try {
    const response = await post("/v1/chat", { messages: conversation }, view);
    if (response) await stream(response, view, { text: "" });
    else conversation.pop();
  } catch (error) {
    view.extra.append(el("p", "error", String(error)));
  } finally {
    $("send").disabled = false;
    $("question").focus();
  }
};
$("question").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("ask").requestSubmit(); }
});
loadHealth();
</script>
</body>
</html>
